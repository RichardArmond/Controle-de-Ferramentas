<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>
        Login - Controle de Ferramentas
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <img src="{{ url_for('static', filename='img/IBAR.png') }}"
                 class="login-logo">

            <h2>
                Controle de Ferramentas
            </h2>

            <p>
                Faça login para continuar
            </p>

            <form method="post">

                <div class="mb-3">

                    <input type="text"
                           name="usuario"
                           class="form-control form-control-lg"
                           placeholder="Usuário"
                           required>

                </div>

                <div class="mb-4">

                    <input type="password"
                           name="senha"
                           class="form-control form-control-lg"
                           placeholder="Senha"
                           required>

                </div>

                <div class="d-grid">

                    <button class="btn btn-primary btn-lg">

                        Entrar

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
