<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>Mensagem do Sistema</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#f4f6f9;
            font-family:Arial;
        }

        .container{
            width:100%;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{

            background:white;

            width:420px;

            padding:35px;

            border-radius:14px;

            box-shadow:0 0 25px rgba(0,0,0,0.08);

            text-align:center;
        }

        .icone{

            font-size:55px;

            margin-bottom:15px;
        }

        .sucesso{
            color:#28a745;
        }

        .erro{
            color:#dc3545;
        }

        .alerta{
            color:#ffc107;
        }

        h2{
            margin-bottom:15px;
            color:#333;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        a{
            display:inline-block;

            padding:12px 22px;

            background:#007bff;

            color:white;

            text-decoration:none;

            border-radius:8px;

            transition:0.2s;
        }

        a:hover{
            background:#0056b3;
        }

    </style>

</head>
<body>

    <div class="container">

        <div class="box">

            <div class="icone {{ tipo }}">

                {% if tipo == 'sucesso' %}
                    ✅
                {% elif tipo == 'erro' %}
                    ❌
                {% else %}
                    ⚠️
                {% endif %}

            </div>

            <h2>{{ titulo }}</h2>

            <p>{{ mensagem }}</p>

            <a href="{{ voltar }}">
                Voltar
            </a>

        </div>

    </div>

</body>
</html>
